apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-data-restored
spec:
  storageClassName: zfs-nfs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
  dataSource:
    name: example-data-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
