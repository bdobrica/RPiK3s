---
- name: Fetch a locally usable kubeconfig
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig
    - ansible.builtin.copy:
        content: "{{ (kubeconfig.content | b64decode) | regex_replace('127\\.0\\.0\\.1', ansible_host) }}"
        dest: "{{ playbook_dir }}/../.env/kubeconfig.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
